name: Run Integrations Tests
permissions: {}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up .NET environment (assuming C# is the primary language)
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x' # Adjust to your target version

      # Install dependencies
      - name: Install dependencies
        run: dotnet restore tna-judgments-parser.sln

      # Build
      - name: Build
        env: 
          SIXLABORSLICENSEKEY: ${{ secrets.SIXLABORSLICENSEKEY }}
        run: dotnet build tna-judgments-parser.sln --no-restore --configuration release

      # Run tests
      - name: Run tests
        env:
          XUNIT_PRINT_MAX_STRING_LENGTH: 100
        run: dotnet test --solution tna-judgments-parser.sln --no-build --configuration release --coverlet --coverlet-output-format cobertura --report-xunit-markdown --results-directory ./coverage

      - name: Publish test results to job summary
        if: ${{ !cancelled() }}
        run: cat coverage/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/*.xml
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
