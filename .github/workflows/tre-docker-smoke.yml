name: TRE Docker Smoke Test
permissions: {}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          secrets: |
            "SIXLABORS_LICENSE_KEY=${{ secrets.SIXLABORSLICENSEKEY }}"
          context: .
          file: ./TRE/DockerfileV2
          tags: tre-lambda-test

      - name: Run Docker container
        run: |
          docker run -d --name tre-lambda-test -p 9000:8080 -e AWS_REGION=eu-west-2 tre-lambda-test

      - name: Wait for container to start
        run: |
          sleep 10

      - name: Smoke test with test-event.json
        run: |
          curl -s -X POST "http://localhost:9000/2015-03-31/functions/function/invocations" \
            -H "Content-Type: application/json" \
            --data-binary @test-event.json > response.json
      - name: Assert response output
        run: |
          expected=$(cat <<'EOF'
          {"parser-outputs":{"xml":null,"metadata":null,"images":[],"log":null,"error-messages":["error saving TDR-2024-SMOKE.xml to S3: BucketName is a required property and must be set before making this call. (Parameter 'PutObjectRequest.BucketName')","error saving metadata.json to S3: BucketName is a required property and must be set before making this call. (Parameter 'PutObjectRequest.BucketName')","error saving parser.log to S3: BucketName is a required property and must be set before making this call. (Parameter 'PutObjectRequest.BucketName')"]}}
          EOF
          )
          actual=$(cat response.json | jq -c .)
          if [ "$actual" = "$expected" ]; then
            echo "Response matches expected output."
            echo "$actual"
          else
            echo "Unexpected response: $actual"
            exit 1
          fi

      - name: Stop and remove container
        run: |
          docker stop tre-lambda-test
          docker rm tre-lambda-test
